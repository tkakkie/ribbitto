services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ribbitto-dev-only
      POSTGRES_DB: ribbitto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ribbitto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
