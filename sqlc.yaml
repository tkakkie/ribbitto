version: "2"
sql:
  # The legacy layered store: conversation's channel, topic and message
  # queries until step 4; it keeps no org or account query. sqlc reads only
  # the files directly in db/queries/, so modules' query directories stay
  # out of it. channel.sql and message.sql's InsertMessage, GetMessage,
  # ListMessagesBefore and GetMessages are duplicated in conversation/ until
  # step 4.15, and topic.sql's GetTopic and GetDefaultTopic until 4.16.
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/
    gen:
      go:
        package: sqlcgen
        out: internal/infra/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  # Each module has its own entry and generated package (decision 26).
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/identity/
    gen:
      go:
        package: sqlcgen
        out: internal/identity/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/realtime/
    gen:
      go:
        package: sqlcgen
        out: internal/realtime/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/org/
    gen:
      go:
        package: sqlcgen
        out: internal/org/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/conversation/
    gen:
      go:
        package: sqlcgen
        out: internal/conversation/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
