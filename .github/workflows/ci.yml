name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# CI runs untrusted pull request code, so it gets read-only access and no
# secrets. Anything that labels or merges lives in a separate workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A single job named "ci" is the required status check. Keep every check in
  # this one job and do not add path filters: a required check that is
  # skipped never reports, and the pull request can then never be merged.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ribbitto-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIBBITTO_TEST_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      RIBBITTO_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify generated files
        run: |
          make generate
          make css
          if ! test -z "$(git status --porcelain)"; then
            git status --short
            exit 1
          fi

      - name: verify schema docs
        env:
          RIBBITTO_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/ribbitto_schema?sslmode=disable
        run: |
          psql "$RIBBITTO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ribbitto_schema TEMPLATE template0'
          go run ./cmd/ribbitto migrate up
          make schema-docs
          if ! test -z "$(git status --porcelain docs/schema)"; then
            git status --short docs/schema
            exit 1
          fi

      # The Makefile pins golangci-lint for both local checks and CI.
      - name: check
        run: make check
