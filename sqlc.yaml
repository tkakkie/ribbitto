version: "2"
sql:
  # The legacy layered store. sqlc reads only the files directly in
  # db/queries/, so modules' query directories stay out of it.
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/
    gen:
      go:
        package: sqlcgen
        out: internal/infra/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  # Each module has its own entry and generated package (decision 26).
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/identity/
    gen:
      go:
        package: sqlcgen
        out: internal/identity/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations/
    queries: db/queries/realtime/
    gen:
      go:
        package: sqlcgen
        out: internal/realtime/internal/postgres/sqlcgen
        sql_package: pgx/v5
        omit_unused_structs: true
