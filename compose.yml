services:
  postgres:
    image: postgres:18
    # Two uncached required-DB `make check` runs at -p 2 peaked at 49 client
    # backends (#636), so 100 leaves about twice that: at most two at once.
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ribbitto-dev-only
      POSTGRES_DB: ribbitto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ribbitto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
