# Temporary diagnostic for #1980; removed before the final head.
name: diag-agy-command

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: diag-agy-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: diag (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slice-default
            selector: ^TestAgyCheckCommand
            parallel: ""
          - name: slice-p1
            selector: ^TestAgyCheckCommand
            parallel: "1"
          - name: slice-p2
            selector: ^TestAgyCheckCommand
            parallel: "2"
          - name: t-endtoend
            selector: ^TestAgyCheckCommandEndToEnd$
            parallel: ""
          - name: t-lifecycle
            selector: ^TestAgyCheckCommandInvalidLifecycle$
            parallel: ""
          - name: t-signal
            selector: ^TestAgyCheckCommandSignalInvalid$
            parallel: ""
          - name: t-failsclosed
            selector: ^TestAgyCheckCommandFailsClosed$
            parallel: ""
          - name: t-revalidates
            selector: ^TestAgyCheckCommandRevalidatesMarker$
            parallel: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Runner and build warm-up
        run: |
          set -euo pipefail
          nproc
          go version
          uptime
          warm_start=$(date +%s.%N)
          go test -race -p 2 -timeout 40m -count=1 -run '^$' ./cmd/argonreview
          warm_end=$(date +%s.%N)
          awk -v start="$warm_start" -v end="$warm_end" 'BEGIN { printf "DIAG compile+link %.3f\n", end - start }'

      - name: Measure test command
        env:
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_PARALLEL: ${{ matrix.parallel }}
        run: |
          set -euo pipefail
          args=(-run "$TEST_SELECTOR")
          if [[ -n "$TEST_PARALLEL" ]]; then
            args+=(-parallel "$TEST_PARALLEL")
          fi
          if command -v vmstat > /dev/null 2>&1; then
            vmstat 5 > vmstat.log &
          else
            top -b -d 5 > vmstat.log &
          fi
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true; wait "$sampler_pid" 2>/dev/null || true' EXIT
          start=$(date +%s.%N)
          set +e
          go test -race -p 2 -timeout 40m -count=1 -json "${args[@]}" ./cmd/argonreview | tee test.json
          status=${PIPESTATUS[0]}
          set -e
          end=$(date +%s.%N)
          awk -v start="$start" -v end="$end" 'BEGIN { printf "DIAG command-wall %.6f\n", end - start }'
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          trap - EXIT
          tail -n 60 vmstat.log
          # The first sample describes time since boot, not this command.
          awk '
            $1 == "r" {
              for (i = 1; i <= NF; i++) {
                if ($i == "us") us = i
                if ($i == "sy") sy = i
                if ($i == "id") idle = i
              }
              next
            }
            us && $1 ~ /^[0-9]+$/ {
              if (samples++ == 0) next
              busy += $us + $sy; free += $idle; n++
            }
            /^%?Cpu\(s\):/ {
              if (samples++ == 0) next
              sub(/^[^:]*:/, ""); gsub(/,/, "")
              for (i = 1; i < NF; i += 2) {
                if ($(i+1) == "us" || $(i+1) == "sy") busy += $i
                if ($(i+1) == "id") free += $i
              }
              n++
            }
            END {
              if (n) printf "DIAG cpu-average us+sy=%.2f%% id=%.2f%% samples=%d\n", busy/n, free/n, n
              else print "DIAG cpu-average unavailable (no interval samples)"
            }
          ' vmstat.log
          exit "$status"

      - name: Summarize every test and harness setup
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -s test.json ]]; then
            printf 'No test JSON was produced.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -rs '
            def epoch:
              capture("^(?<date>[0-9-]+T[0-9:]+)(?:\\.(?<fraction>[0-9]+))?(?<zone>Z|[+-][0-9]{2}:[0-9]{2})$")
              | (.date + "Z" | fromdateiso8601)
                + ("0." + (.fraction // "0") | tonumber)
                - (if .zone == "Z" then 0 else
                    ((.zone[1:3] | tonumber) * 3600 + (.zone[4:6] | tonumber) * 60)
                    * (if .zone[0:1] == "+" then 1 else -1 end)
                  end);
            def seconds: if . == null then "n/a" else tostring end;
            . as $events
            | ($events[0].Time | epoch) as $origin
            | [$events[] | select(.Test != null)] as $tests
            | ($tests | group_by(.Test) | map(
                .[0].Test as $name
                | (map(select(.Action == "run")) | first | .Time) as $start
                | (map(select(.Action == "pass" or .Action == "fail" or .Action == "skip")) | last) as $final
                | (map(select(.Action == "pass" or .Action == "fail")) | last | .Elapsed) as $elapsed
                | {name: $name, elapsed: $elapsed,
                   start: (if $start == null then null else ($start | epoch) - $origin end),
                   end: (if $final == null then null else ($final.Time | epoch) - $origin end)}
                | . + {span: (if .start == null or .end == null then null else .end - .start end)}
              ) | sort_by(-(.span // -1), .name)) as $rows
            | "Distinct top-level tests with run: \([$tests[] | select(.Action == "run" and (.Test | contains("/") | not)) | .Test] | unique | length)",
              "Distinct subtests: \([$tests[].Test | select(contains("/"))] | unique | length)",
              "name\telapsed_s\twall_span_s\tfirst_run_offset_s\tfinal_offset_s",
              ($rows[] | [.name, (.elapsed | seconds), (.span | seconds), (.start | seconds), (.end | seconds)] | @tsv),
              "DIAG output lines:",
              ($events[] | .Output? // empty | split("\n")[] | select(contains("DIAG ")))
          ' test.json | tee test-summary.txt
          # Keep the complete log above; bound the duplicate job summary.
          {
            printf '```text\n'
            head -c 50000 test-summary.txt
            if [[ $(wc -c < test-summary.txt) -gt 50000 ]]; then
              printf '\n[Truncated; see the complete step log.]\n'
            fi
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
