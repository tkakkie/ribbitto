version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - forbidigo
    - nilerr
    - revive
    - sqlclosecheck
    - staticcheck
  exclusions:
    # Generated code must pass every enabled linter except those excluded below.
    generated: disable
    rules:
      - path: '_templ\.go$'
        linters: [errcheck, revive]
  settings:
    depguard:
      # Lax rules restrict listed imports only. Exact roots and slash prefixes
      # allow a module's or package's sub-packages without allowing similarly
      # named packages. File globs need separate selectors for roots and
      # descendants. A module's or package's own import rules exclude tests;
      # the migration and bridge rules also apply to tests.
      rules:
        # Only the platform owns migrations (decision 26); tests that need a
        # schema version migrate through pgtest's Migrator.
        migrations:
          list-mode: lax
          files: ["$all", "!**/internal/platform/postgres/*.go", "!**/internal/platform/postgres/**/*.go"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/db/migrations
              desc: Only internal/platform/postgres owns migrations; tests use its pgtest helpers.
        # Only stores unwrap the platform's Tx and Snapshot to pgx (decision 26).
        # The platform's own runner tests unwrap to prove one transaction. The
        # lint fixtures in internal/lintfixture prove both directions.
        bridge:
          list-mode: lax
          files: ["$all", "!**/internal/postgres/*.go", "!**/internal/postgres/**/*.go", "!**/internal/platform/postgres/tx_test.go"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/platform/postgres/pgxbridge
              desc: Only stores under internal/postgres unwrap Tx and Snapshot; see decision 26.
        kernel:
          list-mode: lax
          files: ["**/internal/kernel/*.go", "**/internal/kernel/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/kernel$
          deny: &non_html
            - pkg: github.com/tkakkie/ribbitto/internal/
              desc: Respect the dependency direction in AGENTS.md.
            - pkg: github.com/a-h/templ$
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: github.com/a-h/templ/
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: html/template$
              desc: Only internal/web produces HTML; see AGENTS.md.
        platform:
          list-mode: lax
          files: ["**/internal/platform/*.go", "**/internal/platform/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/platform$
            - github.com/tkakkie/ribbitto/internal/platform/
            - github.com/tkakkie/ribbitto/internal/kernel$
          deny: *non_html
        # Module imports live in module_imports_test.go. These rules retain
        # the separate HTML restriction, with the existing file exceptions.
        identity:
          list-mode: lax
          files: ["**/internal/identity/*.go", "**/internal/identity/**/*.go", "!**/internal/identity/identitypg/*.go", "!**/internal/identity/identitytest/*.go", "!$test"]
          deny: &module_html
            - pkg: github.com/a-h/templ$
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: github.com/a-h/templ/
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: html/template$
              desc: Only internal/web produces HTML; see AGENTS.md.
        identitywiring:
          list-mode: lax
          files: ["**/internal/identity/identitypg/*.go", "!$test"]
          deny: *module_html
        # realtime is a module (decision 26).
        realtime:
          list-mode: lax
          files: ["**/internal/realtime/*.go", "**/internal/realtime/**/*.go", "!$test"]
          deny: *module_html
        # org is a module (decision 26).
        org:
          list-mode: lax
          files: ["**/internal/org/*.go", "**/internal/org/**/*.go", "!**/internal/org/orgtest/*.go", "!$test"]
          deny: *module_html
        # conversation is a module (decisions 26 and 27).
        conversation:
          list-mode: lax
          files: ["**/internal/conversation/*.go", "**/internal/conversation/**/*.go", "!**/internal/conversation/conversationtest/*.go", "!$test"]
          deny: *module_html
        presence:
          list-mode: lax
          files: ["**/internal/presence/*.go", "**/internal/presence/**/*.go", "!$test"]
          deny: *module_html
        typing:
          list-mode: lax
          files: ["**/internal/typing/*.go", "**/internal/typing/**/*.go", "!$test"]
          deny: *module_html
        unread:
          list-mode: lax
          files: ["**/internal/unread/*.go", "**/internal/unread/**/*.go", "!$test"]
          deny: *module_html
        # Fixtures also produce no HTML (decision 29).
        identityfixture:
          list-mode: lax
          files: ["**/internal/identity/identitytest/*.go", "!$test"]
          deny: *module_html
        orgfixture:
          list-mode: lax
          files: ["**/internal/org/orgtest/*.go", "!$test"]
          deny: *module_html
        conversationfixture:
          list-mode: lax
          files: ["**/internal/conversation/conversationtest/*.go", "!$test"]
          deny: *module_html
        web:
          list-mode: lax
          files: ["**/internal/web/*.go", "**/internal/web/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/web/static$
            - github.com/tkakkie/ribbitto/internal/web$
            - github.com/tkakkie/ribbitto/internal/web/
            - github.com/tkakkie/ribbitto/internal/kernel$
            - github.com/tkakkie/ribbitto/internal/identity$
            - github.com/tkakkie/ribbitto/internal/org$
            - github.com/tkakkie/ribbitto/internal/conversation$
            - github.com/tkakkie/ribbitto/internal/realtime$
            - github.com/tkakkie/ribbitto/internal/unread$
            - github.com/tkakkie/ribbitto/internal/presence$
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/
              desc: Respect the dependency direction in AGENTS.md.
        view:
          list-mode: lax
          files: ["**/internal/web/view/*.go", "**/internal/web/view/**/*.go", "!$test"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/identity$
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/identity/
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/org$
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/org/
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/conversation$
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/conversation/
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
    revive:
      rules:
        - name: exported
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^templ\.Raw$'
          pkg: '^github\.com/a-h/templ$'
          msg: Use escaped templ components instead of raw HTML.
