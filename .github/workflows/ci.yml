name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# CI runs untrusted pull request code, so it gets read-only access and no
# secrets. Anything that labels or merges lives in a separate workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A single job named "ci" is the required status check. Keep every check in
  # this one job and do not add path filters: a required check that is
  # skipped never reports, and the pull request can then never be merged.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The Makefile pins golangci-lint for both local checks and CI.
      - name: check
        run: make check
