name: ci

on:
  pull_request:
    # Not ready_for_review: marking a draft ready does not change its head,
    # and CI already ran on that head, so a rerun only delays the merge.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Nightly, rerun all checks to catch drift in dependencies or the runner image.
  schedule:
    - cron: "23 3 * * *"

# CI runs untrusted pull request code, so it gets read-only access and no
# secrets. Anything that labels or merges lives in a separate workflow.
permissions:
  contents: read

# The event is in the group so that a nightly run and a push to main never
# cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required status check is the job named "ci" at the end; the other
  # jobs run in parallel, each on its own runner. Only jobs running Go
  # tests have their own PostgreSQL (#992). Do not add path filters: a workflow that path filters skip never
  # reports, and the pull request can then never be merged. Every job runs on
  # every event.
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ribbitto-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIBBITTO_TEST_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      RIBBITTO_REQUIRE_DB: "1"
      RIBBITTO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Own key: setup-go v6+ defaults to root go.mod, shared with tests.
          # Primary-key hits never re-save, so a cache saved by a test job
          # lacks the tools' dependencies (#1115).
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/tbls/go.sum

      - name: verify generated files
        run: |
          make generate
          make css
          if ! test -z "$(git status --porcelain)"; then
            git status --short
            exit 1
          fi

      - name: verify schema docs
        env:
          RIBBITTO_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/ribbitto_schema?sslmode=disable
        run: |
          psql "$RIBBITTO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ribbitto_schema TEMPLATE template0'
          go run ./cmd/ribbitto migrate up
          make schema-docs
          if ! test -z "$(git status --porcelain docs/schema)"; then
            git status --short docs/schema
            exit 1
          fi

      # make check is check-static, check-test, check-tools, check-web and
      # test-web in order; this job runs the first and the third. tools/download
      # pins golangci-lint for both local checks and CI, invoked by the Makefile.
      - name: check-static
        run: make check-static

      - name: check-tools
        run: make check-tools

      - name: package-import edge changes
        # HEAD^1 is the PR merge commit's base, or the previous commit on main.
        run: |
          changes=$(go -C tools run ./deps --diff HEAD^1 ..)
          # The log repeats the summary for readers who cannot see summaries.
          printf '%s\n' "$changes" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$changes" | awk '/^- Added: `/ {
            sub(/^- Added: `/, ""); sub(/`$/, "")
            gsub(/%/, "%25")
            printf "::notice file=docs/dependencies.md::Added package-import edge: %s\n", $0
          }'

  web-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RIBBITTO_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: make web-install
        env:
          npm_config_omit: optional
      - run: make check-web
      - run: make test-web
        if: ${{ !cancelled() }}
      - run: go -C tools test -count=1 -v ./webtypes ./domcontract -run '^TestReal(TypeScript|ContractTypeScript|NodeTests)$'

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Fails when a known vulnerability is reachable from our code; see
      # "Checks" in the README for what to do.
      - name: govulncheck
        run: make vuln

  # The slowest packages, one tools/testshard shard per job. testshard -check
  # (in make check) fails unless this matrix names each of its shards once.
  # Web has one non-browser slice and three slices running only TestBrowser.
  # The remaining packages run in test-rest beside checks.
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [loadgen, cmd, web-nonbrowser, web-1/3, web-2/3, web-3/3, realtime]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ribbitto-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFLAGS: -count=1
      RIBBITTO_TEST_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      RIBBITTO_REQUIRE_DB: "1"
      RIBBITTO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: check-test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go -C tools run ./testshard -run .. "$SHARD"

  test-rest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ribbitto-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The restored Go cache also holds test results;
      # this job's tests must run every time.
      GOFLAGS: -count=1
      RIBBITTO_TEST_DATABASE_URL: postgres://postgres:ribbitto-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      RIBBITTO_REQUIRE_DB: "1"
      RIBBITTO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # testshard owns the packages, selector and flags and propagates failure.
      - name: check-test (rest)
        run: |
          go -C tools run ./testshard -run .. rest

  # The required check. A job whose needs failed is skipped by default, and a
  # skipped job satisfies a required check, so this one always runs and
  # passes only when every job it needs succeeded.
  ci:
    needs: [checks, test, test-rest, vuln, web-types]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'length == 5 and all(.[]; .result == "success")' > /dev/null
