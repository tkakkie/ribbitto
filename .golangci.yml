version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - revive
  exclusions:
    # Generated code must still obey the raw HTML ban and dependency rules.
    generated: disable
    rules:
      - path: '_templ\.go$'
        linters: [errcheck, revive]
      - path: '^internal/infra/postgres/sqlcgen/'
        linters: [errcheck, revive]
  settings:
    depguard:
      # Lax rules restrict listed imports only. Exact roots and slash prefixes
      # allow each layer's sub-packages without allowing similarly named layers.
      # File globs need separate selectors for roots and descendants.
      # Layer rules exclude tests; migration ownership also applies to tests.
      rules:
        # Temporary (decision 26, until the migration's last step): the four
        # target-version tests in internal/infra/postgres keep migrating
        # directly until their module moves.
        migrations:
          list-mode: lax
          files: ["$all", "!**/internal/platform/postgres/*.go", "!**/internal/platform/postgres/**/*.go", "!**/internal/infra/postgres/default_channel_test.go", "!**/internal/infra/postgres/event_log_test.go", "!**/internal/infra/postgres/member_handle_test.go", "!**/internal/infra/postgres/topic_test.go", "!**/cmd/ribbitto/*.go", "!**/cmd/ribbitto/**/*.go"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/db/migrations
              desc: Only internal/platform/postgres and cmd/ribbitto own migrations.
        # Only stores unwrap the platform's Tx and Snapshot to pgx (decision 26).
        # internal/infra/postgres may until the migration's last step. The
        # lint fixtures in internal/lintfixture prove both directions.
        bridge:
          list-mode: lax
          files: ["$all", "!**/internal/postgres/*.go", "!**/internal/postgres/**/*.go", "!**/internal/platform/postgres/*.go", "!**/internal/platform/postgres/**/*.go", "!**/internal/infra/postgres/*.go", "!**/internal/infra/postgres/**/*.go"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/platform/postgres/pgxbridge
              desc: Only stores under internal/postgres unwrap Tx and Snapshot; see decision 26.
        kernel:
          list-mode: lax
          files: ["**/internal/kernel/*.go", "**/internal/kernel/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/kernel$
          deny: &non_html
            - pkg: github.com/tkakkie/ribbitto/internal/
              desc: Respect the dependency direction in AGENTS.md.
            - pkg: github.com/a-h/templ$
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: github.com/a-h/templ/
              desc: Only internal/web produces HTML; see AGENTS.md.
            - pkg: html/template$
              desc: Only internal/web produces HTML; see AGENTS.md.
        platform:
          list-mode: lax
          files: ["**/internal/platform/*.go", "**/internal/platform/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/platform$
            - github.com/tkakkie/ribbitto/internal/platform/
            - github.com/tkakkie/ribbitto/internal/kernel$
          deny: *non_html
        # domain keeps ID as an alias of kernel.ID until the migration's last
        # step removes the package (decision 26).
        domain:
          list-mode: lax
          files: ["**/internal/domain/*.go", "**/internal/domain/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/domain$
            - github.com/tkakkie/ribbitto/internal/domain/
            - github.com/tkakkie/ribbitto/internal/kernel$
          deny: *non_html
        app:
          list-mode: lax
          files: ["**/internal/app/*.go", "**/internal/app/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/app$
            - github.com/tkakkie/ribbitto/internal/app/
            - github.com/tkakkie/ribbitto/internal/domain$
            - github.com/tkakkie/ribbitto/internal/domain/
          deny: *non_html
        postgres:
          list-mode: lax
          files: ["**/internal/infra/postgres/*.go", "**/internal/infra/postgres/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/infra/postgres$
            - github.com/tkakkie/ribbitto/internal/infra/postgres/
            - github.com/tkakkie/ribbitto/internal/domain$
            - github.com/tkakkie/ribbitto/internal/domain/
            - github.com/tkakkie/ribbitto/internal/app$
            - github.com/tkakkie/ribbitto/internal/app/
            # Temporary, until the migration's last step: infra/postgres/pgtest
            # delegates to the platform's database lifecycle, and the legacy
            # stores may take the platform's Tx and Snapshot and unwrap them.
            - github.com/tkakkie/ribbitto/internal/platform/postgres/pgtest$
            - github.com/tkakkie/ribbitto/internal/platform/postgres$
            - github.com/tkakkie/ribbitto/internal/platform/postgres/pgxbridge$
          deny: *non_html
        realtime:
          list-mode: lax
          files: ["**/internal/realtime/*.go", "**/internal/realtime/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/internal/realtime$
            - github.com/tkakkie/ribbitto/internal/realtime/
            - github.com/tkakkie/ribbitto/internal/domain$
            - github.com/tkakkie/ribbitto/internal/domain/
          deny: *non_html
        web:
          list-mode: lax
          files: ["**/internal/web/*.go", "**/internal/web/**/*.go", "!$test"]
          allow:
            - github.com/tkakkie/ribbitto/web/static$
            - github.com/tkakkie/ribbitto/internal/web$
            - github.com/tkakkie/ribbitto/internal/web/
            - github.com/tkakkie/ribbitto/internal/domain$
            - github.com/tkakkie/ribbitto/internal/domain/
            - github.com/tkakkie/ribbitto/internal/app$
            - github.com/tkakkie/ribbitto/internal/app/
            - github.com/tkakkie/ribbitto/internal/realtime$
            - github.com/tkakkie/ribbitto/internal/realtime/
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/
              desc: Respect the dependency direction in AGENTS.md.
        view:
          list-mode: lax
          files: ["**/internal/web/view/*.go", "**/internal/web/view/**/*.go", "!$test"]
          deny:
            - pkg: github.com/tkakkie/ribbitto/internal/app$
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/app/
              desc: Handlers convert use-case results to view models; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/infra$
              desc: Views do no I/O; see docs/architecture/web-layers.md.
            - pkg: github.com/tkakkie/ribbitto/internal/infra/
              desc: Views do no I/O; see docs/architecture/web-layers.md.
    revive:
      rules:
        - name: exported
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^templ\.Raw$'
          pkg: '^github\.com/a-h/templ$'
          msg: Use escaped templ components instead of raw HTML.
